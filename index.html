<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111113"><meta name="description" content="MAHAVEL — coordination studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>MAHAVEL / STUDIO</title></head><body><div id="app"><div class="boot">MAHAVEL<span>STUDIO / LOADING</span></div></div><script type="module">
const mount=document.getElementById('app');
const displayError=(detail)=>{
 if(!mount || !mount.querySelector('.boot'))return;
 const message=String(detail||'Chargement impossible').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
 mount.innerHTML='<main style="max-width:560px;margin:12vh auto;padding:28px;font:16px Arial,sans-serif;color:#eee"><h1>MAHAVEL STUDIO</h1><p>Impossible de démarrer l’application.</p><p style="color:#f4b6b6;overflow-wrap:anywhere">'+message+'</p><p>Vérifie ta connexion Internet, puis recharge la page. Si cela persiste, transmets ce message à l’assistance.</p><button onclick="location.reload()" style="padding:12px 20px;cursor:pointer">Réessayer</button></main>';
};
window.addEventListener('error',e=>{if(mount?.querySelector('.boot'))displayError(e.message||'Erreur JavaScript')});
window.addEventListener('unhandledrejection',e=>{if(mount?.querySelector('.boot'))displayError(e.reason?.message||String(e.reason))});
import('./js/app.js?v=0.4.4').catch(e=>displayError(e.message||String(e)));
setTimeout(()=>{if(mount?.querySelector('.boot'))displayError('Délai de chargement dépassé. Un module JavaScript ou une ressource réseau ne répond pas.')},15000);
</script></body></html>
