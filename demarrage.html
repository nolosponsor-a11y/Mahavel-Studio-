<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111113"><meta name="description" content="MAHAVEL — coordination studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>MAHAVEL / STUDIO</title></head><body><div id="app"><div class="boot">MAHAVEL<span>STUDIO / LOADING</span></div></div><script>
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
(function(){
 const mount=document.getElementById('app');
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
 const diagnose=(label,detail)=>{
   if(!mount || !mount.querySelector('.boot'))return;
   mount.innerHTML='<main style="max-width:580px;margin:12vh auto;padding:28px;font:16px Arial,sans-serif;color:#eee"><h1>MAHAVEL STUDIO</h1><p><strong>'+esc(label)+'</strong></p><p style="color:#ffbcbc;overflow-wrap:anywhere">'+esc(detail||'Erreur inconnue')+'</p><p>Transmets une capture de ce message pour obtenir le correctif.</p><button onclick="location.reload()" style="padding:12px 20px">Réessayer</button></main>';
 };
 window.addEventListener('error',e=>diagnose('Erreur au démarrage',e.message||'Erreur de chargement'));
 window.addEventListener('unhandledrejection',e=>diagnose('Erreur de connexion',e.reason?.message||String(e.reason)));
 const guard=setTimeout(()=>diagnose('Délai de chargement dépassé','Le chargement du JavaScript ou de la connexion Supabase est bloqué.'),12000);
 import('./js/app.js?release=047-mobile-chat').then(()=>{clearTimeout(guard);if(mount?.querySelector('.boot'))setTimeout(()=>diagnose('Démarrage incomplet','Le module est chargé mais l’interface ne s’est pas affichée.'),7000)}).catch(e=>{clearTimeout(guard);diagnose('Erreur de module JavaScript',e.message||String(e))});
})();
</script></body></html>
